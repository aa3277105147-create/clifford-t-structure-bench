[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clifford-t-structure-bench"
version = "0.1.0"
description = "Reproducible structure-aware Clifford+T amplitude experiments"
requires-python = ">=3.12"
dependencies = ["numpy", "networkx>=3", "matplotlib", "quimb", "cotengra", "qiskit", "qiskit-qasm3-import", "psutil"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pfsparse-bench = "pfsparse.bench.cli:main"

[tool.setuptools.packages.find]
include = ["pfsparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
